{% extends "base.html" %}{% block body %}
<h1>Registro de estudiante</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">
<label>Correo <input name="email" type="email" required maxlength="254"></label>
<label>Carnet <input name="carnet" required pattern="\d{4}-\d{2}-\d{3,6}" placeholder="1290-23-10001"></label>
<label>Contraseña (12+ caracteres) <input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label>
<button>Registrar</button></form>
{% endblock %}
