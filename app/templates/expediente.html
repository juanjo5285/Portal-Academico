{% extends "base.html" %}{% block titulo %}Expediente{% endblock %}{% block body %}
<h1>Expediente {{ est.carnet }}</h1>
<p class="datos">{{ est.nombres }} {{ est.apellidos }} · DPI: {{ dpi_mask }}</p>
<table><tr><th>Curso</th><th>Nota</th></tr>
{% for n in notas %}<tr><td>{{ n.curso }}</td><td>{{ n.nota }}</td></tr>{% endfor %}</table>
<form method="post" action="{{ url_for('portal.reporte') }}" class="fila">
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  <input type="hidden" name="carnet" value="{{ est.carnet }}">
  <select name="tipo" aria-label="Tipo de reporte"><option>notas</option><option>asistencia</option></select>
  <button>Descargar reporte</button>
</form>
{% endblock %}
