{% extends "base.html" %}{% block titulo %}Comentarios{% endblock %}{% block body %}
<h1>Comentarios</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  <label for="texto">Nuevo comentario</label>
  <textarea id="texto" name="texto" maxlength="1000" required></textarea>
  <p class="preview">Vista previa: <span id="preview"></span></p>
  <div class="fila"><button>Publicar</button></div>
</form>
{# Jinja2 codifica < > & " ' automáticamente (autoescape). No se usa |safe. #}
{% for c in comentarios %}<div class="comentario"><b>{{ c.autor }}</b> <small>{{ c.fecha }}</small><p>{{ c.texto }}</p></div>{% endfor %}
<script src="{{ url_for('static', filename='comentarios.js') }}"></script>
{% endblock %}
