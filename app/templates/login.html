{% extends "base.html" %}{% block body %}
<h1>Iniciar sesión</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">
<label>Correo <input name="email" type="email" required maxlength="254" autocomplete="username"></label>
<label>Contraseña <input name="password" type="password" required autocomplete="current-password"></label>
<button>Entrar</button></form>
<p><a href="{{ url_for('portal.registro') }}">Crear cuenta</a></p>
{% endblock %}
