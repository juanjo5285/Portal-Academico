# Integración continua: en cada push y pull request se buscan secretos en TODO
# el historial y se ejecutan las pruebas de seguridad. Si algo falla, el cambio
# queda marcado en rojo y no debería fusionarse.
name: seguridad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # historial completo, no solo el último commit
      - name: Instalar Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Escanear historial
        run: gitleaks git . --redact -v

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit bandit
      - name: Pruebas (secretos aleatorios generados en el propio job)
        run: python -m pytest -v
      # Informativos: muestran hallazgos en el registro del job sin bloquearlo,
      # porque dependen de avisos externos que cambian con el tiempo.
      - name: Dependencias con vulnerabilidades conocidas
        run: pip-audit -r requirements.txt
        continue-on-error: true
      - name: Análisis estático del código
        run: bandit -r app -ll -x app/vuln.py
        continue-on-error: true
