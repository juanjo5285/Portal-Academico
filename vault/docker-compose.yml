# Bóveda de secretos de LABORATORIO (modo dev: en memoria, sin TLS, NO usar en producción)
services:
  vault:
    image: hashicorp/vault:1.17
    ports: ["127.0.0.1:8200:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?defina VAULT_DEV_ROOT_TOKEN}
    cap_add: [IPC_LOCK]
